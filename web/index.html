<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Počasí Home — ALADIN</title>
<meta name="description" content="Osobní předpověď z modelu ALADIN ČHMÚ na 72 hodin.">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Počasí">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1 id="place">Počasí</h1>
  <div class="topbar-right">
    <p class="when" id="when"></p>
    <button class="refresh" id="refresh" type="button" title="Načíst znovu" aria-label="Načíst předpověď znovu">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.4-5.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>

<section class="now" aria-label="Aktuální hodina">
  <div class="now-main">
    <p class="now-temp">
      <svg class="param-icon icon-temp" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
        <path d="M12 3.4a3.1 3.1 0 0 1 3.1 3.1v7.2a5.1 5.1 0 1 1-6.2 0V6.5A3.1 3.1 0 0 1 12 3.4z"
              fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 8.6v6.4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="12" cy="17.9" r="2.7" fill="currentColor"/>
      </svg>
      <span id="nowTemp">—</span>
    </p>
    <p class="now-rain">
      <svg class="param-icon icon-rain" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M 6.5,15 a 3.6,3.6 0 0,1 0.4,-7.2 a 4.6,4.6 0 0,1 8.7,-1.2 a 3.6,3.6 0 0,1 1.2,7 Z" fill="currentColor"/>
        <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="8.5" y1="17" x2="7.3" y2="21"/>
          <line x1="12" y1="17" x2="10.8" y2="21"/>
          <line x1="15.5" y1="17" x2="14.3" y2="21"/>
        </g>
      </svg>
      <span id="nowRain"></span>
    </p>
  </div>
  <dl class="now-side">
    <div>
      <dt>
        <svg class="param-icon icon-wind" viewBox="1 1 22 22" width="24" height="24" aria-hidden="true">
          <g stroke="currentColor" stroke-linecap="round" fill="none">
            <path d="M12 10.5V21.5" stroke-width="1.8"/>
            <g stroke-width="2.6">
              <path d="M12 9.2 11.5 2.4"/>
              <path d="M10.9 10.6 4.6 13.4"/>
              <path d="M13.1 10.6 19.2 14.2"/>
            </g>
          </g>
          <circle cx="12" cy="10.2" r="1.5" fill="currentColor"/>
        </svg>
        <span class="sr-only">Vítr</span>
      </dt>
      <dd id="nowWind">—</dd>
    </div>
    <div>
      <dt>
        <svg class="param-icon icon-cloud" viewBox="2.5 5.5 17 12.5" width="26" height="19" aria-hidden="true">
          <path d="M 6.5,17 a 3.6,3.6 0 0,1 0.4,-7.2 a 4.6,4.6 0 0,1 8.7,-1.2 a 3.6,3.6 0 0,1 1.2,7 Z" fill="currentColor"/>
        </svg>
        <span class="sr-only">Oblačnost</span>
      </dt>
      <dd id="nowCloud">—</dd>
    </div>
  </dl>
</section>

<div class="icon-row" id="iconRow" aria-hidden="true"></div>

<nav class="views" id="views" aria-label="Zobrazení">
  <button type="button" data-view="temperature" class="is-active">Teplota</button>
  <button type="button" data-view="wind">Vítr</button>
  <button type="button" data-view="clouds">Oblačnost</button>
  <button type="button" data-view="table">Tabulka</button>
</nav>

<main>
  <section id="chartView" aria-label="Meteogram na 60 hodin">
    <svg id="chart" role="img" aria-labelledby="chartTitle"></svg>
    <p id="chartTitle" class="sr-only">
      Meteogram na 60 hodin. Všech 72 hodin předpovědi je dostupných v tabulce
      po přepnutí tlačítkem Tabulka.
    </p>
  </section>

  <section id="tableView" hidden aria-label="Tabulka hodnot">
    <div class="table-wrap">
      <table id="dataTable">
        <caption class="sr-only">Hodinové hodnoty předpovědi</caption>
        <thead>
          <tr>
            <th scope="col">Čas</th>
            <th scope="col">Teplota<br><span class="unit">°C</span></th>
            <th scope="col">Srážky<br><span class="unit">mm/h</span></th>
            <th scope="col">Oblačnost<br><span class="unit">%</span></th>
            <th scope="col">Vítr<br><span class="unit">m/s · °</span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <p class="error" id="error" hidden></p>
</main>

<footer>
  <p id="runline"></p>
  <p id="ageline">Stáří předpovědi: <span id="age">—</span> <span class="badge" id="offline" hidden>zastaralé</span></p>
  <p>Zdroj dat: ČHMÚ, model ALADIN (CC BY 4.0)</p>
</footer>

<script src="app.js"></script>
</body>
</html>

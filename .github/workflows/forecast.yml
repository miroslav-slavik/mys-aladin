name: forecast

# Two layers. The four primary slots sit 34-42 minutes after the model
# publishes each run (delays measured in Phase 1, see docs/parametry.md), so a
# new forecast normally reaches the site within the hour. The safety net every
# two hours exists because scheduled runs in Actions are best-effort: they have
# been observed several hours late and, once, skipped altogether, which left
# one model run unpublished. With the net, the next attempt is never more than
# two hours away.
#
# The extra slots are cheap for both sides: a run that finds nothing new exits
# in seconds after reading four directory listings, and downloads nothing.
on:
  schedule:
    - cron: "15 4 * * *"        # run 00 UTC, published around 03:34
    - cron: "0 11 * * *"        # run 06 UTC, published around 10:26
    - cron: "0 16 * * *"        # run 12 UTC, published around 15:18
    - cron: "0 23 * * *"        # run 18 UTC, published around 22:25
    - cron: "45 1-23/2 * * *"   # safety net, odd hours at :45
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even when the newest run is already published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build forecast
        # The scheduled runs never force; only a manual dispatch can, which is
        # what makes a publish testable outside the model's publication window.
        run: python -m pipeline ${{ inputs.force && '--force' || '' }}

      - name: Publish when the run changed
        run: |
          # --porcelain also reports the file as untracked, which is what the
          # very first run looks like; git diff alone would miss that.
          if [ -z "$(git status --porcelain -- data/forecast.json)" ]; then
            echo "no new run, nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json
          git commit -m "Update forecast to run $(python -c "import json;print(json.load(open('data/forecast.json'))['run_id'])")"
          git push

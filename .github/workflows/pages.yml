name: pages

# Deploys the PWA together with the current forecast. The forecast workflow
# commits with GITHUB_TOKEN, and such a push does not start another workflow,
# so this one also listens for that workflow finishing.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/forecast.json"
      - "scripts/build-site.sh"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [forecast]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Take the newest area pack
        # The pack is not in the repository. Every forecast run that produced
        # one saved it under a key starting with this prefix, and a partial
        # match restores the most recent of them. A deploy triggered by a
        # change in web/ therefore keeps the pack the last model run left,
        # rather than removing it from the site until the next run.
        uses: actions/cache/restore@v4
        with:
          path: build/area
          # A key no run ever writes, so the prefix below always decides.
          key: area-v1-none
          restore-keys: |
            area-v1-

      - name: Assemble the site
        run: ./scripts/build-site.sh site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
